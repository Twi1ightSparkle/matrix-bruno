info:
  name: Look up email
  type: http
  seq: 2

http:
  method: POST
  url: https://vector.im/_matrix/identity/v2/lookup
  body:
    type: json
    data: |-
      {
        "addresses": [
          "someone@domain.com email"
        ],
        "algorithm": "none",
        "pepper": "ab123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
