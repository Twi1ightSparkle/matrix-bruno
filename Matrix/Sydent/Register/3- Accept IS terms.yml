info:
  name: 3- Accept IS terms
  type: http
  seq: 3

http:
  method: POST
  url: https://vector.im/_matrix/identity/v2/terms
  body:
    type: json
    data: |-
      {
        "user_accepts": [
          "https://vector.im/identity-server-privacy-notice-1"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
