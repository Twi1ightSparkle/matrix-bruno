info:
  name: Protect media from quarantine
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/media/protect/:mediaId"
  params:
    - name: mediaId
      value: "{{mediaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
