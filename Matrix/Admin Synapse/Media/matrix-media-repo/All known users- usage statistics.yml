info:
  name: All known users- usage statistics
  type: http
  seq: 1

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/usage/:url/users-stats?access_token={{mmrAdminSecret}}&limit=100&order_by=media_length&dir=b"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query
    - name: limit
      value: "100"
      type: query
    - name: order_by
      value: media_length
      type: query
    - name: dir
      value: b
      type: query
    - name: from
      value: "100"
      type: query
      disabled: true
    - name: url
      value: "{{url}}"
      type: path

