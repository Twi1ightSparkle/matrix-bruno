info:
  name: Listing all background tasks
  type: http
  seq: 4

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/tasks/all?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
