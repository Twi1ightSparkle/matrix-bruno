info:
  name: Purge individual record
  type: http
  seq: 15

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/purge/:url/:mediaId?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query
    - name: url
      value: "{{url}}"
      type: path
    - name: mediaId
      value: "{{mediaId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
