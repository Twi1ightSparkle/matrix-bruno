info:
  name: Getting information on a specific background task
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/tasks/:taskId?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query
    - name: taskId
      value: "{{taskId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
