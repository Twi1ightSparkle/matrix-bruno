info:
  name: Purge quarantined media
  type: http
  seq: 13

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/purge/quarantined?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
