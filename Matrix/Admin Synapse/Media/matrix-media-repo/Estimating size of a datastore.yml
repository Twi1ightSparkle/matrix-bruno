info:
  name: Estimating size of a datastore
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/datastores/:datastore/size_estimate?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query
    - name: datastore
      value: "{{datastore}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
