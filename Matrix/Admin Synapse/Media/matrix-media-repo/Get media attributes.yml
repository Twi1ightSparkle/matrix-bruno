info:
  name: Get media attributes
  type: http
  seq: 5

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/media/:url/:mediaId/attributes?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query
    - name: url
      value: "{{url}}"
      type: path
    - name: mediaId
      value: "{{mediaId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
