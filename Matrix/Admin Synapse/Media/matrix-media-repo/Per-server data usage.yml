info:
  name: Per-server data usage
  type: http
  seq: 8

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/unstable/admin/usage/:url?access_token={{mmrAdminSecret}}"
  params:
    - name: access_token
      value: "{{mmrAdminSecret}}"
      type: query
    - name: url
      value: "{{url}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
