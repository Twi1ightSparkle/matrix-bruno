info:
  name: Quarantine media - Synapse media repo
  type: http
  seq: 4

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/media/quarantine/:url/:mediaId"
  params:
    - name: url
      value: "{{url}}"
      type: path
    - name: mediaId
      value: "{{mediaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
