info:
  name: Delete room status by Delete ID
  type: http
  seq: 6

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v2/rooms/delete_status/:deleteId"
  params:
    - name: deleteId
      value: "{{deleteId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
