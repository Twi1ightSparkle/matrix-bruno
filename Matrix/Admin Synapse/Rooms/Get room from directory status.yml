info:
  name: Get room from directory status
  type: http
  seq: 13

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/directory/list/room/:roomId"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
