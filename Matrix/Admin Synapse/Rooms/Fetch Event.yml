info:
  name: Fetch Event
  type: http
  seq: 11

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/fetch_event/:eventId"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
