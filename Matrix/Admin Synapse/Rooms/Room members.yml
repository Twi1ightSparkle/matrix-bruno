info:
  name: Room members
  type: http
  seq: 16

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/rooms/:roomId/members"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
