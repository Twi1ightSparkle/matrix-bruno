info:
  name: Room aliases
  type: http
  seq: 15

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/rooms/:roomId/aliases"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
