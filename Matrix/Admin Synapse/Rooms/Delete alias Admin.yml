info:
  name: Delete alias Admin
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/directory/room/:roomAlias"
  params:
    - name: roomAlias
      value: "%23alias:{{url}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
