info:
  name: Show reported events
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/event_reports"
  params:
    - name: limit
      value: "100"
      type: query
      disabled: true
    - name: from
      value: "101"
      type: query
      disabled: true
    - name: dir
      value: f
      type: query
      disabled: true
    - name: user_id
      value: "@reporter:{{url}}"
      type: query
      disabled: true
    - name: room_id
      value: $12345
      type: query
      disabled: true
    - name: event_sender_user_id
      value: "@event_sender:{{url}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
