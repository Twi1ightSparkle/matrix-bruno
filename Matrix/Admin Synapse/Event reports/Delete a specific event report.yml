info:
  name: Delete a specific event report
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{protocol}}://{{delegatedURL}}_synapse/admin/v1/event_reports/:report_id"
  params:
    - name: report_id
      value: "12345"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
