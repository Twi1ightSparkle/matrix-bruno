info:
  name: Show details of a specific event report
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/event_reports/:report_id"
  params:
    - name: report_id
      value: "12345"
      type: path
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.room_id,
        method: jsonq
      variable:
        name: roomId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.event_id
        method: jsonq
      variable:
        name: eventId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
