info:
  name: Recalculate the user directory
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/background_updates/start_job"
  body:
    type: json
    data: |-
      {
        "job_name": "regenerate_directory"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
