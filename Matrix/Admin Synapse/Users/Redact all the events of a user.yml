info:
  name: Redact all the events of a user
  type: http
  seq: 14

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/user/:userId/redact"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "rooms": [
          "!roomid1",
          "!roomid2"
        ],
        "reason": "Optional reason the redaction is being requested, ie 'spam', 'abuse', etc. This will be included in each redaction event, and be visible to users.",
        "limit": 1000
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.redact_id
        method: jsonq
      variable:
        name: redactId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: <https://element-hq.github.io/synapse/latest/admin_api/user_admin_api.html#redact-all-the-events-of-a-user>
