info:
  name: Check if user is admin
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/users/:userId/admin"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
