info:
  name: User devices
  type: http
  seq: 23

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v2/users/:userId/devices"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
