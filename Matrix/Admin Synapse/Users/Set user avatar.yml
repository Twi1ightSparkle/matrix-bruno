info:
  name: Set user avatar
  type: http
  seq: 18

http:
  method: PUT
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v2/users/:userId"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "avatar_url": "mxc://{{url}}/abcd"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
