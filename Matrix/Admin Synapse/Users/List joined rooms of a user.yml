info:
  name: List joined rooms of a user
  type: http
  seq: 10

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/users/:userId/joined_rooms"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Gets a list of all `room_id` that a specific `user_id` is joined to and is a member of (participating in).
