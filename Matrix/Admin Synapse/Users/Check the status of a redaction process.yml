info:
  name: Check the status of a redaction process
  type: http
  seq: 15

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/user/redact_status/:redactId"
  params:
    - name: redactId
      value: "{{redactId}}"
      type: path
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: <https://element-hq.github.io/synapse/latest/admin_api/user_admin_api.html#check-the-status-of-a-redaction-process>
