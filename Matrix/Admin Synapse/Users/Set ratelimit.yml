info:
  name: Set ratelimit
  type: http
  seq: 17

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/users/:userId/override_ratelimit"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "messages_per_second": 0,
        "burst_count": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
