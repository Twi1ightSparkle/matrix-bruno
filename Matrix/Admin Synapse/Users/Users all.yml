info:
  name: Users all
  type: http
  seq: 25

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v2/users?order_by=creation_ts&dir=b&guests=false&deactivated=true"
  params:
    - name: order_by
      value: creation_ts
      type: query
    - name: dir
      value: b
      type: query
    - name: guests
      value: "false"
      type: query
    - name: deactivated
      value: "true"
      type: query
    - name: user_id
      value: localpart
      type: query
      disabled: true
    - name: from
      value: "100"
      type: query
      disabled: true
  auth: inherit

