info:
  name: Find user by 3PID
  type: http
  seq: 8

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/threepid/:3pidType/users/:3pid"
  params:
    - name: 3pidType
      value: "{{3pidType}}"
      type: path
    - name: 3pid
      value: "{{3pid}}"
      type: path
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.user_id
        method: jsonq
      variable:
        name: userId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
