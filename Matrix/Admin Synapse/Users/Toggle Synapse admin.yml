info:
  name: Toggle Synapse admin
  type: http
  seq: 22

http:
  method: PUT
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/users/:userId/admin"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "admin": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
