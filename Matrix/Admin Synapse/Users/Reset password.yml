info:
  name: Reset password
  type: http
  seq: 16

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/reset_password/:userId"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "new_password": "password",
        "logout_devices": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
