info:
  name: Get one token
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/registration_tokens/:token"
  params:
    - name: token
      value: secr3t
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
