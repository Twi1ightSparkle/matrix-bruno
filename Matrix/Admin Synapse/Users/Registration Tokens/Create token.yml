info:
  name: Create token
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/registration_tokens/new"
  body:
    type: json
    data: |-
      {
        "token": "secret",
        "uses_allowed": 10,
        "expiry_time": 1640995200000,
        "length": 64
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
