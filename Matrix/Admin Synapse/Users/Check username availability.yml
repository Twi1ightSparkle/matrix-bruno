info:
  name: Check username availability
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/username_availabile?username=$localPart"
  params:
    - name: username
      value: $localPart
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
