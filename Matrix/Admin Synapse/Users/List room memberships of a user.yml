info:
  name: List room memberships of a user
  type: http
  seq: 11

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_synapse/admin/v1/users/:userId/memberships"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Gets a list of room memberships for a specific `user_id`. This endpoint differs from `List joined rooms of a user` in that it returns rooms with memberships other than "join".
