info:
  name: Federation tester JSON report
  type: http
  seq: 3

http:
  method: GET
  url: https://federationtester.matrix.org/api/report?server_name={{url}}
  params:
    - name: server_name
      value: "{{url}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
