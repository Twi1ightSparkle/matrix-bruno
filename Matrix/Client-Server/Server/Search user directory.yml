info:
  name: Search user directory
  type: http
  seq: 10

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/user_directory/search"
  body:
    type: json
    data: |
      {
        "limit": 10,
        "search_term": "foo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
