info:
  name: Get room power levels
  type: http
  seq: 19

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/rooms/:roomId/state/m.room.power_levels"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
