info:
  name: Room summary CS
  type: http
  seq: 17

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v1/room_summary/:roomId"
  params:
    - name: note
      value: Also accepts a room alias
      type: query
      disabled: true
    - name: roomId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
