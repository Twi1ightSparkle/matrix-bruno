info:
  name: Invite user
  type: http
  seq: 12

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/rooms/:roomId/invite"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "user_id": "{{userId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
