info:
  name: Join room
  type: http
  seq: 10

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/join/:roomId"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
