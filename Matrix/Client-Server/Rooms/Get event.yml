info:
  name: Get event
  type: http
  seq: 9

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/rooms/:roomId/event/:eventId"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
    - name: eventId
      value: "{{eventId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
