info:
  name: User shared rooms
  type: http
  seq: 26

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v1/mutual_rooms?user_id=@user:domain.tld"
  params:
    - name: user_id
      value: "@user:domain.tld"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
