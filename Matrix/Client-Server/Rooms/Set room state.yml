info:
  name: Set room state
  type: http
  seq: 24

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/rooms/:roomId/state"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
