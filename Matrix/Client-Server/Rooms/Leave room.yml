info:
  name: Leave room
  type: http
  seq: 11

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/rooms/:roomId/leave"
  params:
    - name: roomId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
