info:
  name: Resolve alias
  type: http
  seq: 15

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/directory/room/:roomAlias"
  params:
    - name: roomAlias
      value: "%23alias:{{url}}"
      type: path

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.room_id
        method: jsonq
      variable:
        name: roomId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
