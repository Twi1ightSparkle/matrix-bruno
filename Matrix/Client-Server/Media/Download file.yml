info:
  name: Download file
  type: http
  seq: 1

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v1/media/download/:url/:mediaId"
  params:
    - name: admin_unsafely_bypass_quarantine
      value: "false"
      type: query
      disabled: true
    - name: url
      value: "{{url}}"
      type: path
    - name: mediaId
      value: "{{mediaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
