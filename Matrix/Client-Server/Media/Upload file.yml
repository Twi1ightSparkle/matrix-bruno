info:
  name: Upload file
  type: http
  seq: 2

http:
  method: POST
  url: "{{protocol}}://{{delegatedURL}}/_matrix/media/r0/upload"
  body:
    type: multipart-form
    data:
      - name: ""
        type: file
        value:
          - /path/to/file.png
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const data = res.body;
          const mxc_uri = data.content_uri;
          const uri = String(mxc_uri).replace('mxc://', '');
          const media_id = uri.split('/')[1];
          bru.setEnvVar("mediaId", media_id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
