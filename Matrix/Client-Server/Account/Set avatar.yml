info:
  name: Set avatar
  type: http
  seq: 10

http:
  method: PUT
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/profile/:userId/avatar_url"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "avatar_url": "mxc://{{url}}/{{mediaId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
