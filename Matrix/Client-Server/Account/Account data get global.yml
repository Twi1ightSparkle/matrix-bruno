info:
  name: Account data get global
  type: http
  seq: 1

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/v3/user/:userId/account_data/type"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
