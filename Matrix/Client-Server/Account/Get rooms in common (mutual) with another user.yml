info:
  name: Get rooms in common (mutual) with another user
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/unstable/uk.half-shot.msc2666/user/mutual_rooms?user_id"
  params:
    - name: user_id
      value: "@someone:example.com"
      type: query
    - name: from
      value: abc123
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
