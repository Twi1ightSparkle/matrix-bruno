info:
  name: Check username availability
  type: http
  seq: 4

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/register/available?username=localpart"
  params:
    - name: username
      value: localpart
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
