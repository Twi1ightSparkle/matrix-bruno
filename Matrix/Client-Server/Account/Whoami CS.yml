info:
  name: Whoami CS
  type: http
  seq: 11

http:
  method: GET
  url: "{{protocol}}://{{delegatedURL}}/_matrix/client/r0/account/whoami"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.user_id
        method: jsonq
      variable:
        name: userId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
