info:
  name: Delete a user email
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/user-emails/:emailId"
  params:
    - name: emailId
      value: "{{emailId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
