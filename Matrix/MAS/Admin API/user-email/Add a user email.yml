info:
  name: Add a user email
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/user-emails"
  body:
    type: json
    data: |-
      {
        "user_id": "{{masUserId}}",
        "email": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
