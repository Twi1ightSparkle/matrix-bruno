info:
  name: List user emails by userId
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/user-emails?filter[user]={{masUserId}}"
  params:
    - name: filter[user]
      value: "{{masUserId}}"
      type: query
    - name: filter[email]
      value: "{{3pid}}"
      type: query
      disabled: true
    - name: page[before]
      value: ""
      type: query
      disabled: true
    - name: page[after]
      value: ""
      type: query
      disabled: true
    - name: page[first]
      value: ""
      type: query
      disabled: true
    - name: page[last]
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const url = req.getUrl();
        if (url.includes('?')) {
          let [link, query] = url.split('?');
          const queryEncoded = query.replace('+', '%2B');
          const newUrl = `${link}?${queryEncoded}`;
          req.setUrl(newUrl);
        }
    - type: after-response
      code: |-
        const body = res.body;
        if (body.data && body.data.length > 0) {
          bru.setEnvVar("masEmailId", body.data[0].id);
          bru.setEnvVar("masUserId", body.data[0].attributes.user_id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
