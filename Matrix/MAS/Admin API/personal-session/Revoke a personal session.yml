info:
  name: Revoke a personal session
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/personal-sessions/:masPersonalSessionId/revoke"
  params:
    - name: masPersonalSessionId
      value: "{{masPersonalSessionId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
