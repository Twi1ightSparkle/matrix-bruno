info:
  name: Set the password for a user
  type: http
  seq: 4

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/users/:masUserId/set-password"
  params:
    - name: masUserId
      value: "{{masUserId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "password": "placeholder",
        "skip_password_check": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
