info:
  name: List users
  type: http
  seq: 1

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/users"
  params:
    - name: page[before]
      value: ""
      type: query
      disabled: true
    - name: page[after]
      value: ""
      type: query
      disabled: true
    - name: page[first]
      value: ""
      type: query
      disabled: true
    - name: page[last]
      value: ""
      type: query
      disabled: true
    - name: count
      value: "true"
      type: query
      disabled: true
    - name: filter[admin]
      value: "false"
      type: query
      disabled: true
    - name: filter[status]
      value: one of active,locked,deactivated
      type: query
      disabled: true
    - name: filter[legacy-guest]
      value: "false"
      type: query
      disabled: true
    - name: filter[search]
      value: username
      type: query
      disabled: true
    - name: filter[active-oauth2-client]
      value: 01KXDZ57BA54PQ8ZHVQG1GA5VW
      type: query
      disabled: true
    - name: filter[has-active-oauth2-session]
      value: true|false
      type: query
      disabled: true
    - name: filter[has-active-compat-session]
      value: true|false
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
