info:
  name: Create a new user
  type: http
  seq: 2

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/users"
  body:
    type: json
    data: |-
      {
        "username": "localpart",
        "displayname": "Display Name",
        "avatar_url": "mxc://{{url}}/mediaId",
        "skip_homeserver_check": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body;
        if (body.data?.id) {
          bru.setEnvVar("masUserId", body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
