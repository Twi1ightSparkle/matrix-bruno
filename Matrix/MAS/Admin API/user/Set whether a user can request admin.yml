info:
  name: Set whether a user can request admin
  type: http
  seq: 6

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/users/:masUserId/set-admin"
  params:
    - name: masUserId
      value: "{{masUserId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "admin": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
