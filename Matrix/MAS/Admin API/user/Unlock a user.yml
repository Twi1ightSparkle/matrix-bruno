info:
  name: Unlock a user
  type: http
  seq: 9

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/users/:masUserId/unlock"
  params:
    - name: masUserId
      value: "{{masUserId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
