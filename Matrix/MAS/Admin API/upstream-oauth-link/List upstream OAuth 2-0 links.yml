info:
  name: List upstream OAuth 2-0 links
  type: http
  seq: 1

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/upstream-oauth-links?filter[user]={{masUserId}}"
  params:
    - name: filter[user]
      value: "{{masUserId}}"
      type: query
    - name: page[before]
      value: ""
      type: query
      disabled: true
    - name: page[after]
      value: ""
      type: query
      disabled: true
    - name: page[first]
      value: ""
      type: query
      disabled: true
    - name: page[last]
      value: ""
      type: query
      disabled: true
    - name: count
      value: "true"
      type: query
      disabled: true
    - name: filter[provider]
      value: ""
      type: query
      disabled: true
    - name: filter[subject]
      value: ""
      type: query
      disabled: true
    - name: filter[human-account-name]
      value: user@email.tld
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body;
        if (body.data && body.data.length > 0) {
          bru.setEnvVar("masOauthLinkId", body.data[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
