info:
  name: Delete an upstream OAuth 2.0 link
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/upstream-oauth-links/:masOauthLinkId"
  params:
    - name: masOauthLinkId
      value: "{{masOauthLinkId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
