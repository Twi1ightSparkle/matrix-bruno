info:
  name: Get an OAuth 2.0 client
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/oauth2-clients/:oauthClientId"
  params:
    - name: oauthClientId
      value: "{{oauthClientId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
