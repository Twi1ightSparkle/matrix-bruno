info:
  name: Get a user session
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/user-sessions/:masUserSessionId"
  params:
    - name: masUserSessionId
      value: "{{masUserSessionId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
