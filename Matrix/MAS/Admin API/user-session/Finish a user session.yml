info:
  name: Finish a user session
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/user-sessions/:masUserSessionId/finish"
  params:
    - name: masUserSessionId
      value: "{{masUserSessionId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
