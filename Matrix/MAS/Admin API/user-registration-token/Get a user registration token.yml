info:
  name: Get a user registration token
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/user-registration-tokens/:masTokenId"
  params:
    - name: masTokenId
      value: "{{masTokenId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
