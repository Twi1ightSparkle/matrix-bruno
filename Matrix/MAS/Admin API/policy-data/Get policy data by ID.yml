info:
  name: Get policy data by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/policy-data/:masPolicyId"
  params:
    - name: masPolicyId
      value: "{{masPolicyId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
