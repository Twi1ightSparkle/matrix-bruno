info:
  name: Get a compatibility session
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/compat-sessions/:masCompatSessionId"
  params:
    - name: masCompatSessionId
      value: "{{masCompatSessionId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
