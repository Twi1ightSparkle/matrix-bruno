info:
  name: Finish a compatibility session
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/compat-sessions/:masCompatSessionId/finish"
  params:
    - name: masCompatSessionId
      value: "{{masCompatSessionId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
