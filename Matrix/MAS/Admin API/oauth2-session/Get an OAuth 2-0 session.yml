info:
  name: Get an OAuth 2-0 session
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{masAdminEndpoint}}/api/admin/v1/oauth2-sessions/:oauthSessionId"
  params:
    - name: oauthSessionId
      value: "{{oauthSessionId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
