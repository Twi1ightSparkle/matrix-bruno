opencollection: 1.0.0

info:
  name: Matrix

request:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("userId") && bru.getEnvVar("localpart")) {
          const mxid = `@${bru.getEnvVar("localpart")}:${bru.getEnvVar("url")}`;
          bru.setEnvVar("userId", mxid);
        }
bundled: false
extensions: {}
